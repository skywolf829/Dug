# Generate Dug.xcodeproj with: brew install xcodegen && xcodegen   (run in this folder)
name: Dug
options:
  bundleIdPrefix: com.skywolf829
  deploymentTarget:
    iOS: "17.0"
targets:
  Dug:
    type: application
    platform: iOS
    sources: [Dug]
    info:
      path: Dug/Info.plist
      properties:
        CFBundleDisplayName: Dug
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Dug's collar talks to your phone over Bluetooth.
        # Keep the BLE link alive while the phone is locked in a pocket.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        # Bundle IDs are globally unique on Apple's side; change this if you fork the project.
        PRODUCT_BUNDLE_IDENTIFIER: com.skywolf829.dug
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 28JU682E7D  # Personal Team; swap in your own if you fork
